<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DictLite · 轻量词典</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23264f42'/%3E%3Cpath d='M11 10h8c8 0 13 5 13 10s-5 10-13 10h-8z' fill='none' stroke='%23f6f6ee' stroke-width='3'/%3E%3Cpath d='M17 10v20' stroke='%23f6f6ee' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  
  <script src="entry-utils.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5v15M3 4.5c3-1 6-.5 9 1.5 3-2 6-2.5 9-1.5V19c-3-1-6-.5-9 1.5-3-2-6-2.5-9-1.5z"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6M12 7v5l3 2"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="m17 5 3-1 3 15-3 1zM5 8h1M12 8h1"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.7 2.4-2.4.7L4 8l1.3 2.1L5 12l.3 1.9L4 16l1.9 1.9 2.4.7L9 21h6l.7-2.4 2.4-.7L20 16l-1.3-2.1L19 12l-.3-1.9L20 8l-1.9-1.9-2.4-.7L15 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-5 5 5-5 5 5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14m-5-5 5 5 5-5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v13H3z"/></symbol>
  </svg>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#search" aria-label="DictLite 首页">
        <span class="brand-mark"><svg viewBox="0 0 40 40" fill="none"><path d="M11 10h8c8 0 13 5 13 10s-5 10-13 10h-8z" stroke="currentColor" stroke-width="2.6"/><path d="M17 10v20" stroke="currentColor" stroke-width="1.8"/></svg></span>
        <span>DictLite<span class="brand-caption">轻量词典</span></span>
      </a>
      <nav class="primary-nav" aria-label="主导航">
        <button class="nav-item active" data-view="search" aria-label="查词" title="查词" aria-current="page"><svg><use href="#i-search"/></svg><span>查词</span><span class="nav-shortcut">⌘ K</span></button>
        <button class="nav-item" data-view="saved" aria-label="单词本" title="单词本"><svg><use href="#i-bookmark"/></svg><span>单词本</span><span class="nav-count" id="saved-count">0</span></button>
        <button class="nav-item" data-view="history" aria-label="查词历史" title="查词历史"><svg><use href="#i-history"/></svg><span>查词历史</span></button>
        <button class="nav-item" data-view="libraries" aria-label="词典管理" title="词典管理"><svg><use href="#i-library"/></svg><span>词典管理</span></button>
        <button class="nav-item" data-view="settings" aria-label="设置" title="设置"><svg><use href="#i-settings"/></svg><span>设置</span></button>
      </nav>
      <div class="header-note"><span class="version-tag">0.2.0</span></div>
    </header>

    <div class="workspace">
      <main>
        <section id="search-view">
          <div class="page-heading"><div><div class="eyebrow">A LITTLE LIGHT, A LITTLE INSIGHT.</div><h1>让每一个词，清晰起来</h1><p>中英互查，即刻理解。你的轻量词典。</p></div><span class="heading-decoration" aria-hidden="true">Aa<span>字</span></span></div>
          <div class="search-area">
          <form id="search-form" class="search-box" role="search">
            <svg class="search-icon"><use href="#i-search"/></svg>
            <input id="query" role="combobox" aria-label="输入英文单词或中文词语" aria-autocomplete="list" aria-controls="candidates" aria-expanded="false" placeholder="输入英文单词或中文词语…" value="" autocomplete="off" spellcheck="false">
            <button id="clear-query" type="button" class="small-icon clear-query" aria-label="清空搜索"><svg><use href="#i-close"/></svg></button>
            <kbd class="search-shortcut">Ctrl K</kbd>
            <div class="search-separator"></div>
            <select id="language-mode" aria-label="查询方向"><option value="auto">自动识别</option><option value="en">英 → 中</option><option value="zh">中 → 英</option></select>
            <button class="search-submit" type="submit">查词<svg><use href="#i-arrow"/></svg></button>
          </form>
          <div id="suggestions" class="suggestions-panel" hidden><div class="panel-label"><span>搜索建议</span><span id="candidate-count" class="count-pill">0</span></div><div id="candidates" role="listbox" aria-label="搜索建议"></div></div>
          </div>
          <div class="search-meta"><span><span class="mini-dot"></span>从词头开始，也支持释义反查</span><span class="keyboard-tip"><kbd>↑</kbd><kbd>↓</kbd> 选择候选词 <span>·</span> <kbd>Enter</kbd> 查看</span></div>
          <div id="entry" class="entry-panel" aria-live="polite"></div>
          <div class="workspace-footnote"><span><svg><use href="#i-folder"/></svg><span id="data-summary"></span></span><span>中英互查</span></div>
        </section>
        <section id="collection-view" hidden></section>
        <section id="libraries-view" hidden></section>
        <section id="settings-view" hidden></section>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dictionary-import-dialog" class="import-dialog" aria-labelledby="dictionary-import-title">
    <div class="import-dialog-body"><div class="import-dialog-heading"><div><span class="eyebrow">BRING YOUR WORDS HOME.</span><h2 id="dictionary-import-title">导入词典</h2></div><button class="small-icon" id="close-dictionary-import" aria-label="关闭导入词典"> <svg><use href="#i-close"/></svg></button></div>
    <label class="import-field-label" for="dictionary-import-format">导入格式</label><select id="dictionary-import-format"><option value="native">DictLite 词库（SQLite）</option><option value="mdx">MDX（转换后导入）</option></select>
    <div class="import-file-choice"><span><strong id="dictionary-import-filename">尚未选择文件</strong><small id="dictionary-import-filesize">选择要导入的本地词典文件</small></span><button id="choose-dictionary-file">选择文件</button></div>
    <div class="import-flow" id="dictionary-import-flow"></div><p id="dictionary-import-result" class="import-result" role="status"></p>
    </div>
    <div class="import-dialog-footer"><button id="cancel-dictionary-import">取消</button><button id="stop-conversion" hidden>停止转换</button><button class="dialog-primary" id="run-dictionary-import" disabled>校验并导入</button></div>
  </dialog>


</body>
</html>
